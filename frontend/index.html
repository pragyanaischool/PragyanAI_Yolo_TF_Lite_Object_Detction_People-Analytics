
<!doctype html>
<html lang="en">

  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Layout -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser Theme -->
    <meta
      name="theme-color"
      content="#f4f6fa"
    />

    <!-- SEO Description -->
    <meta
      name="description"
      content="PragyanAI People Detection and Counting Dashboard powered by YOLO11 TensorFlow Lite, ByteTrack and OpenCV."
    />

    <!-- Application Title -->
    <title>
      PragyanAI | People Detection &amp; Counting
    </title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Preconnect for Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Inter Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

  </head>

  <body>

    <!-- React Application Root -->
    <div id="root">

      <!-- Visible fallback while React loads -->
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 12px;
          font-family: Inter, Arial, sans-serif;
          color: #172033;
          background: #f4f6fa;
        "
      >

        <div
          style="
            width: 46px;
            height: 46px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            color: white;
            background: #3157d5;
            font-size: 23px;
            font-weight: 800;
          "
        >
          P
        </div>

        <strong>
          PragyanAI
        </strong>

        <span style="font-size: 13px; color: #68758a;">
          Loading People Detection Dashboard...
        </span>

      </div>

    </div>

    <!-- React Entry Point -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>

</html>
