
services:
  - type: web
    name: pragyanai-people-analytics-api
    runtime: python

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

      - key: FRONTEND_ORIGIN
        sync: false

      - key: MODEL_PATH
        value: models/yolo11n.tflite

      - key: OUTPUT_DIR
        value: /tmp/pragyanai_outputs

      - key: UPLOAD_DIR
        value: /tmp/pragyanai_uploads
