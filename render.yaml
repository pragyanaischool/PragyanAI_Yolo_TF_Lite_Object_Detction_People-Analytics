
services:
  - type: web
    name: pragyanai-people-detection-api
    runtime: python

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

      - key: MODEL_PATH
        value: models/yolo11n.tflite

      - key: UPLOAD_DIR
        value: /tmp/pragyanai_uploads

      - key: OUTPUT_DIR
        value: /tmp/pragyanai_outputs

      - key: MAX_UPLOAD_SIZE
        value: "524288000"

      - key: FRONTEND_ORIGIN
        sync: false

      - key: PUBLIC_API_URL
        sync: false
